<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>점심 현황</title>
<!-- 봇·LINE 서버와 미리 연결해 두기(첫 요청의 연결 준비 시간을 화면이 뜨는 동안 처리 — 2026-11-05) -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="preconnect" href="https://static.line-scdn.net">
<link rel="preconnect" href="https://api.line.me" crossorigin>
<style>
  body{font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;margin:0;padding:16px;background:#f6f7f9;color:#212529}
  /* PC LINE 은 미니 화면을 큰 브라우저 탭으로 연다 → 내용을 휴대폰 폭으로 가운데 모음(2026-11-05) */
  #app{max-width:440px;margin:0 auto}
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:#868e96;font-size:13px;margin-bottom:14px}
  .card{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  .name{font-weight:700;font-size:16px}
  .meta{color:#868e96;font-size:12px;margin-top:2px}
  .main{color:#e8590c;font-weight:600;font-size:14px;margin-top:4px}
  .row{font-size:14px;margin-top:6px}
  .cnt{display:inline-block;min-width:44px;font-weight:700}
  .muted{color:#adb5bd}
  .foot{color:#adb5bd;font-size:12px;margin-top:16px;text-align:center}
  button{margin-top:10px;border:0;background:#e9ecef;border-radius:8px;padding:8px 14px;font-size:14px}
  /* 미니 화면(👍·⭐ 누르면 뜨는 창) */
  .done{font-size:18px;font-weight:700;color:#2f9e44;margin:2px 0 10px}
  .err{font-size:15px;color:#e03131;margin:8px 0}
  .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .acts button{margin:0;flex:1;min-width:80px}
  .primary{background:#06c755;color:#fff;font-weight:600}
  .stars{display:flex;gap:6px;justify-content:center;margin-top:10px}
  .stars button{margin:0;width:40px;padding:8px 0}
  .stars .on{background:#ffd43b;font-weight:700}
  .lbl{font-size:12px;color:#868e96;text-align:center;margin-top:12px}
  /* 전체 현황: 별점과 멀리, 크게(잘못 누르지 않게 — 2026-11-05) */
  a.link{display:block;text-align:center;margin-top:32px;padding:14px 0;border:1px solid #ced4da;border-radius:10px;background:#fff;color:#42659a;font-size:15px;font-weight:600;text-decoration:none}
  .hint{font-size:13px;color:#868e96;text-align:center;margin-top:14px}
</style>
</head>
<body>
<!--
  점심봇 화면 두 가지(이 파일에는 이름·데이터가 없다):
  1) 👥 좋아요 현황(보기 전용): ?d=날짜&t=그날 암호 → 봇(Apps Script)에서 그날 현황만 가져옴(구글 로그인 무관)
  2) 📱 미니 화면(LIFF): 카드의 👍·⭐ → https://liff.line.me/{LIFF ID}?a=like|rate&d=&r=&s=&lid=
     LINE 로그인으로 누가 눌렀는지 확인 → 봇이 저장 → '저장됐어요' + 그 식당 명단. 채팅엔 아무것도 안 올라감
  정본: KimRaccoon-CPA/lunch-bot 의 board/index.html → scripts/publish_board.py 로 이 저장소에 올림.
-->
<div id="app"><p class="muted">불러오는 중…</p></div>
<script>
  var API = 'https://script.google.com/macros/s/AKfycbyouGrTsGqrLcDqhK400AIYkKyMtQm1GeciHzf72Zk0g7gSbyqEeopLrI_BTwN6UnevJQ/exec';
  var app = document.getElementById('app');

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text; // 이름은 글자로만(코드가 끼어들 틈 없음)
    return e;
  }

  // 주소 값 읽기 — LIFF 첫 열림은 ?liff.state=%3Fa%3D… 안에 들어 있다
  function params() {
    var q = new URLSearchParams(location.search);
    var st = q.get('liff.state');
    if (st) {
      var inner = new URLSearchParams(st.replace(/^[^?]*\?/, ''));
      inner.forEach(function (v, k) { if (!q.has(k)) q.set(k, v); });
    }
    return q;
  }

  // ───────── 1) 👥 좋아요 현황 ─────────
  function showBoard(data) {
    app.textContent = '';
    if (!data || !data.ok) {
      app.appendChild(el('p', 'muted', (data && data.error) || '불러오지 못했어요. 잠시 후 다시 열어 주세요.'));
      return;
    }
    app.appendChild(el('h1', '', data.title));
    app.appendChild(el('div', 'sub', data.sub));
    if (!data.items.length) app.appendChild(el('p', 'muted', '아직 오늘 후보가 없어요. 단체방에 "점심" 이라고 불러 보세요.'));
    data.items.forEach(function (it) {
      var c = el('div', 'card');
      c.appendChild(el('div', 'name', it.name));
      if (it.meta) c.appendChild(el('div', 'meta', it.meta));
      if (it.main) c.appendChild(el('div', 'main', '🍱 ' + it.main));
      var lk = el('div', 'row');
      lk.appendChild(el('span', 'cnt', '👍 ' + it.likes.length));
      lk.appendChild(it.likes.length ? document.createTextNode(it.likes.join(' · ')) : el('span', 'muted', '아직 없음'));
      c.appendChild(lk);
      if (it.visits.length) {
        var vs = el('div', 'row');
        vs.appendChild(el('span', 'cnt', '⭐ ' + it.visits.length));
        vs.appendChild(document.createTextNode(it.visits.join(' · ')));
        c.appendChild(vs);
      }
      app.appendChild(c);
    });
    var foot = el('div', 'foot', '👍·⭐ 는 단체방 카드 버튼으로');
    var again = el('button', '', '새로고침');
    again.onclick = loadBoard;
    foot.appendChild(document.createElement('br'));
    foot.appendChild(again);
    app.appendChild(foot);
  }

  function loadBoard() {
    var q = params();
    var d = q.get('d') || '';
    var t = q.get('t') || '';
    if (!d || !t) { showBoard({ ok: false, error: '주소가 올바르지 않아요. 카드의 👥 좋아요 현황 버튼으로 열어 주세요.' }); return; }
    app.textContent = '';
    app.appendChild(el('p', 'muted', '불러오는 중…'));
    // credentials: 'omit' — 구글 로그인(여러 계정)과 상관없이 열리게
    fetch(API + '?op=boarddata&d=' + encodeURIComponent(d) + '&t=' + encodeURIComponent(t), { credentials: 'omit' })
      .then(function (r) { return r.json(); })
      .then(showBoard)
      .catch(function () { showBoard({ ok: false, error: '불러오지 못했어요. 잠시 후 다시 열어 주세요.' }); });
  }

  // ───────── 2) 📱 미니 화면(LIFF) ─────────
  // 미니 화면 순서(2026-11-05 '명단 불러오는 중…' 5초 개선):
  //   열리자마자 ① 명단만 먼저 가져오기(op=liffview, 그날 암호 t) + ② LINE 기능 불러와 로그인 확인 → 저장(op=liff)
  //   ①이 오면 명단을 먼저 보여 주고(로그인이 끝났으면 내 이름도 얹어서), ②가 끝나면 최종 화면으로 바꾼다.
  var mini = { d: '', r: '', busy: false, q: null, view: null, final: null, myName: '' };
  // 어디서 얼마나 걸렸나(화면이 열린 뒤 ms) — 저장이 끝나면 봇에 숫자만 보냄(op=liffdiag)
  var diag = { start: Math.round(performance.now()) };

  function mark(k) { diag[k] = Math.round(performance.now()); }

  function sendDiag(extra) {
    try {
      var nav = performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null;
      if (nav) diag.nav = Math.round(nav.responseEnd);
      for (var k in extra) diag[k] = extra[k];
      var body = JSON.stringify(diag);
      var url = API + '?op=liffdiag';
      if (navigator.sendBeacon && navigator.sendBeacon(url, body)) return;
      fetch(url, { method: 'POST', body: body, credentials: 'omit', keepalive: true, headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
    } catch (e) { /* 진단 실패는 무시 */ }
  }

  function instantText(a, s) {
    return a === 'rate' ? '✅ ⭐' + s + ' 저장 — 여기 다녀온 걸로 남겼어요' : a === 'unlike' ? '✅ 👍 취소했어요' : '✅ 👍 좋아요 했어요';
  }

  /** 식당 카드(이름·메뉴·👍 명단·⭐ 명단) */
  function cardEl(rest, likes, visits) {
    var c = el('div', 'card');
    c.appendChild(el('div', 'name', rest.name));
    if (rest.meta) c.appendChild(el('div', 'meta', rest.meta));
    if (rest.main) c.appendChild(el('div', 'main', '🍱 ' + rest.main));
    var lk = el('div', 'row');
    lk.appendChild(el('span', 'cnt', '👍 ' + likes.length));
    lk.appendChild(likes.length ? document.createTextNode(likes.join(' · ')) : el('span', 'muted', '아직 없음'));
    c.appendChild(lk);
    if (visits.length) {
      var vs = el('div', 'row');
      vs.appendChild(el('span', 'cnt', '⭐ ' + visits.length));
      vs.appendChild(document.createTextNode(visits.join(' · ')));
      c.appendChild(vs);
    }
    return c;
  }

  /** 저장 결과가 오기 전: 먼저 받은 명단 + (로그인 확인됐으면) 내가 누른 것을 얹어 보여 줌 */
  function showPreview() {
    if (mini.final || !mini.view) return;
    var v = mini.view;
    var a = mini.q.get('a');
    var s = mini.q.get('s');
    var me = mini.myName;
    var likes = v.likes.slice();
    var visits = v.visits.slice();
    if (me) {
      if (a === 'like' && likes.indexOf(me) === -1) likes.push(me);
      if (a === 'unlike') likes = likes.filter(function (n) { return n !== me; });
      if (a === 'rate') {
        visits = visits.filter(function (x) { return x.split(' ⭐')[0] !== me; });
        visits.push(me + ' ⭐' + s);
      }
    }
    app.textContent = '';
    if (a !== 'view') app.appendChild(el('div', 'done', instantText(a, s)));
    app.appendChild(cardEl(v.restaurant, likes, visits));
    app.appendChild(el('div', 'lbl', a === 'view' ? '불러오는 중…' : '저장 확인 중… 잠시만요'));
  }

  function loadView(q) {
    var t = q.get('t');
    if (!t) return; // 예전 카드(암호 없음)는 저장 결과를 기다림
    fetch(API + '?op=liffview&d=' + encodeURIComponent(mini.d) + '&r=' + encodeURIComponent(mini.r) + '&t=' + encodeURIComponent(t), { credentials: 'omit' })
      .then(function (r) { return r.json(); })
      .then(function (v) {
        mark('view');
        if (v && v.ok) {
          mini.view = v;
          showPreview();
        }
      })
      .catch(function () { /* 먼저 보기 실패는 무시(저장 결과로 보여 줌) */ });
  }

  /** 같은 버튼으로 연 화면이 몇 번째 열린 건지(LINE 이 주소를 바꿔 다시 여는지 확인용) */
  function loadCount(q) {
    try {
      var sig = [q.get('a'), q.get('d'), q.get('r'), q.get('s')].join('|');
      var prev = JSON.parse(sessionStorage.getItem('liffLoad') || 'null');
      var n = prev && prev.sig === sig && Date.now() - prev.at < 20000 ? prev.n + 1 : 1;
      sessionStorage.setItem('liffLoad', JSON.stringify({ sig: sig, at: Date.now(), n: n }));
      return n;
    } catch (e) {
      return 0;
    }
  }

  function inLine() {
    try { return !!(window.liff && liff.isInClient()); } catch (e) { return false; }
  }

  function closeMini() {
    if (inLine()) { liff.closeWindow(); return; }
    // PC 브라우저 탭은 페이지가 스스로 닫을 수 없는 경우가 많다 → 안내
    window.close();
    setTimeout(function () {
      if (!document.getElementById('closehint')) {
        var h = el('div', 'hint', '저장은 끝났어요. 이 탭은 닫으셔도 돼요.');
        h.id = 'closehint';
        app.appendChild(h);
      }
    }, 300);
  }

  function act(a, s, initial) {
    if (mini.busy) return;
    mini.busy = true;
    var token = null;
    try { token = liff.getIDToken(); } catch (e) { token = null; }
    if (!token) { showMini({ ok: false, error: 'LINE 로그인이 필요해요. LINE 앱에서 카드 버튼으로 열어 주세요.' }); mini.busy = false; return; }
    if (initial) mark('post');
    fetch(API + '?op=liff', {
      method: 'POST',
      credentials: 'omit',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // 미리 묻는 요청(preflight) 없이 보내려고
      body: JSON.stringify({ idToken: token, a: a, d: mini.d, r: mini.r, s: s || '' })
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (initial) {
          mark('resp');
          sendDiag({ ok: !!(res && res.ok), server: res && res._ms ? res._ms.total : undefined });
        }
        mini.final = res;
        showMini(res);
      })
      .catch(function () {
        if (initial) sendDiag({ ok: false });
        showMini({ ok: false, error: '저장하지 못했어요. 잠시 후 다시 눌러 주세요.' });
      })
      .then(function () { mini.busy = false; });
  }

  function showMini(res) {
    app.textContent = '';
    if (!res || !res.ok) {
      app.appendChild(el('div', 'err', '⚠️ ' + ((res && res.error) || '문제가 생겼어요.')));
      var c0 = el('button', '', '닫기');
      c0.onclick = closeMini;
      app.appendChild(c0);
      return;
    }
    if (res.message) app.appendChild(el('div', 'done', '✅ ' + res.message));
    app.appendChild(cardEl(res.restaurant, res.likes, res.visits));

    var acts = el('div', 'acts');
    if (res.canLike) {
      var lb = el('button', res.myLike ? '' : 'primary', res.myLike ? '👍 취소' : '👍 좋아요');
      lb.onclick = function () { act(res.myLike ? 'unlike' : 'like'); };
      acts.appendChild(lb);
    }
    var cb = el('button', '', '닫기');
    cb.onclick = closeMini;
    acts.appendChild(cb);
    app.appendChild(acts);

    var here = res.myVisit && res.myVisit.here ? res.myVisit.rating : null;
    app.appendChild(el('div', 'lbl', here ? '여기 다녀왔어요 ⭐' + here + ' · 바꾸려면 다시 누르기' : '여기 다녀왔다면 별점 ⭐'));
    if (res.myVisit && !res.myVisit.here) app.appendChild(el('div', 'lbl', '(지금은 ' + res.myVisit.restaurantName + ' 다녀온 걸로 남아 있어요 — 누르면 여기로 바뀌어요)'));
    var stars = el('div', 'stars');
    [1, 2, 3, 4, 5].forEach(function (s) {
      var b = el('button', here === s ? 'on' : '', String(s));
      b.onclick = function () { act('rate', s); };
      stars.appendChild(b);
    });
    app.appendChild(stars);

    if (res.boardUrl) {
      var a = el('a', 'link', '👥 오늘 전체 현황 보기');
      a.href = res.boardUrl;
      app.appendChild(a);
    }
    if (!inLine()) app.appendChild(el('div', 'hint', 'PC 에서는 브라우저 탭으로 열려요. 다 보셨으면 탭을 닫아 주세요.'));
  }

  /** 저장을 기다리지 않고 바로 보여 주는 화면(2026-11-05: '저장하는 중…' 빈 화면이 5초) — 실패하면 오류 화면으로 바뀜 */
  function showInstant(q) {
    var name = q.get('n') || '';
    app.textContent = '';
    app.appendChild(el('div', 'done', instantText(q.get('a'), q.get('s'))));
    var c = el('div', 'card');
    if (name) c.appendChild(el('div', 'name', name));
    c.appendChild(el('div', 'row muted', '명단 불러오는 중…'));
    app.appendChild(c);
  }

  function startMini(q) {
    mini.q = q;
    mini.d = q.get('d') || '';
    mini.r = q.get('r') || '';
    var lid = q.get('lid') || '';
    var firstOpen = !!new URLSearchParams(location.search).get('liff.state');
    diag.a = q.get('a') || '';
    diag.first = firstOpen;
    diag.hadT = !!q.get('t');
    diag.loads = loadCount(q);
    // 주소 # 뒤 항목 '이름'만(값은 안 봄) — LINE 이 로그인 정보를 처음부터 주는지 확인용
    diag.hashKeys = location.hash ? location.hash.slice(1).split('&').map(function (kv) { return kv.split('=')[0]; }).join(',') : '';
    if (q.get('a') === 'view') {
      app.textContent = '';
      app.appendChild(el('p', 'muted', '불러오는 중…'));
    } else {
      showInstant(q);
    }
    loadView(q); // ① 명단 먼저(로그인 확인을 기다리지 않음)
    var s = document.createElement('script');
    s.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
    s.onload = function () {
      mark('sdk');
      liff.init({ liffId: lid }).then(function () {
        mark('init');
        diag.inClient = inLine();
        try { diag.os = liff.getOS(); } catch (e) { /* 없음 */ }
        if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
        // liff.state 로 처음 열렸으면 SDK 가 진짜 주소로 다시 옮겨 준다 — 그때 다시 실행됨
        if (new URLSearchParams(location.search).get('liff.state')) { sendDiag({ via: 'redirect' }); return; }
        try {
          var dec = liff.getDecodedIDToken();
          mini.myName = (dec && dec.name) || '';
        } catch (e) { mini.myName = ''; }
        showPreview(); // 명단이 먼저 와 있으면 내 이름을 얹어 다시 그림
        act(q.get('a') || 'view', q.get('s'), true); // ② 저장
      }).catch(function () { showMini({ ok: false, error: '미니 화면을 열지 못했어요. 창을 닫고 다시 눌러 주세요.' }); });
    };
    s.onerror = function () { showMini({ ok: false, error: 'LINE 기능을 불러오지 못했어요. 잠시 후 다시 눌러 주세요.' }); };
    document.head.appendChild(s);
  }

  var q0 = params();
  if (q0.get('a') && q0.get('lid')) startMini(q0); else loadBoard();
</script>
</body>
</html>
